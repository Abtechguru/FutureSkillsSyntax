name: MCN 2026 quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - hardening/mcn-2026-launch-readiness

permissions:
  contents: read

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile backend code and tests
        run: python -m compileall -q backend/app backend/tests

  backend-security-tests:
    runs-on: ubuntu-latest
    needs: python-syntax
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install API and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio
      - name: Import FastAPI application without external services
        env:
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:54322/postgres
        run: python -c "from app.main import app; print(app.title)"
      - name: Run authentication security regressions
        env:
          ENVIRONMENT: development
          DEBUG: 'false'
          SECRET_KEY: ci-only-test-key-never-use-in-deployments
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:54322/postgres
          DEV_LOG_EMAILS: 'false'
        run: python -m pytest -q tests/test_auth_boundary_regression.py tests/test_upload_validation.py tests/test_signup_safeguards.py

  web-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Install exact lockfile dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Strict lint of active MCN screens
        run: npm run lint:core
      - name: Full legacy lint audit (known debt, non-blocking)
        continue-on-error: true
        run: npm run lint
      - name: Production dependency audit (known debt, non-blocking)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
